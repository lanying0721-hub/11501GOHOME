            return;
        }

        // 判斷學號是否存在於資料庫
        if (studentDatabase.hasOwnProperty(searchId)) {
            // 🎯 【狀況一】學號在資料庫：呈現學號姓名
            const name = studentDatabase[searchId];
            resultDisplay.innerHTML = `<span class="student-id">${searchId}</span> <span class="student-name">${name}</span>`;
        } else {
            // 🚨 【狀況二】學號不在資料庫：出現紅字「學號 請留校」
            resultDisplay.innerHTML = `<span class="not-found-text">⚠️ ${searchId} 請留校</span>`;
        }
    }
</script>

</body>
</html>
